# Installs the package and runs the test suite across the supported
# Python versions. uv provides both the interpreters and the resolver, so
# no separate Python setup step is needed.

name: pystorms

on:
  push:
    branches: [ master, 'release/**' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: setup.py

    # only-managed keeps every job on a uv supplied interpreter. Without it
    # uv picks up whatever the runner image preinstalled, and macOS ships an
    # Apple signed Python whose hardened runtime refuses to load the ad hoc
    # signed dylib inside the swmm-toolkit wheel.
    - name: Create the environment
      run: uv venv --python ${{ matrix.python-version }} --python-preference only-managed

    - name: Install pystorms and test dependencies
      run: uv pip install . pytest

    - name: Run the test suite
      run: uv run --no-sync pytest -v
