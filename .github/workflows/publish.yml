# Builds the distributions on every push, and publishes them to PyPI when a
# tag is pushed.
#
# Publishing uses PyPI trusted publishing: the job exchanges a short lived
# OIDC token from GitHub for an upload token, so there is no API token stored
# in the repository. This requires a matching trusted publisher to be
# registered on PyPI for the project, pointing at this repository, this
# workflow filename and the pypi environment below.

name: Publish Python 🐍 distributions 📦 to PyPI

on: push

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true

    - name: Build a binary wheel and a source tarball
      run: uv build

    - uses: actions/upload-artifact@v7
      with:
        name: distributions
        path: dist/

  publish:
    name: Publish 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/pystorms

    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: distributions
        path: dist/

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
